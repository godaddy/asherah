name: NuGet Release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the build artifact containing package outputs
        required: true
        type: string
      package-directory:
        description: Directory containing the C# package project and Directory.Build.props
        required: true
        type: string
      release-name:
        description: Package family name used for the release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'godaddy/asherah'
    name: Publish ${{ inputs.release-name }} to NuGet.org
    runs-on: ubuntu-latest
    environment: nuget-production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up C#
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Fetch all tags
        run: git fetch --prune --unshallow --tags

      - name: Cache dotnet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ inputs.release-name }}-${{ hashFiles(format('{0}/**/*.csproj', inputs.package-directory)) }}-v2

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ github.workspace }}/${{ inputs.package-directory }}

      - name: Initialize environment variables
        run: |
          echo "BASE_VERSION=$(grep -o '<Version>.*<.*>' Directory.Build.props | sed 's/<Version>\(.*\)<.*>/\1/')" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$(echo "${BASE_VERSION}" | cut -f2 -d'-')" >> "$GITHUB_ENV"
          echo "BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_ENV"
        working-directory: ${{ inputs.package-directory }}

      - name: NuGet login
        id: nuget-login
        if: startsWith(env.BRANCH, 'release-') && env.VERSION_SUFFIX != 'alpha'
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1.0.0
        with:
          user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish packages
        if: startsWith(env.BRANCH, 'release-') && env.VERSION_SUFFIX != 'alpha'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_NAME: ${{ inputs.release-name }}
        run: |
          TAG="csharp/${RELEASE_NAME}/v${BASE_VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} exists"
            exit 0
          fi

          echo "Releasing ${RELEASE_NAME} v${BASE_VERSION}"
          dotnet pack -c Release
          while IFS= read -r -d '' package; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done < <(find . -name "*${BASE_VERSION}.nupkg" -print0)

          PARENT_COMMIT=$(git rev-parse "${GITHUB_SHA}^2" 2>/dev/null || git rev-parse "${GITHUB_SHA}")
          echo "Creating new tag: ${TAG}, SHA: ${PARENT_COMMIT}"
          git tag "${TAG}" "${PARENT_COMMIT}"
          git push origin "${TAG}"
          echo "Created tag ${TAG}"
        working-directory: ${{ inputs.package-directory }}
